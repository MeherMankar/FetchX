<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FetchX</title>
    <link rel="stylesheet" href="dist/fetchx-extension.css" />
  </head>
  <body>
    <div class="popup-root">

      <!-- ── Header ───────────────────────────────────────────── -->
      <header class="popup-header">
        <div class="popup-logo">
          <div class="logo-tile">
            <img src="icons/icon48.png" alt="" width="32" height="32" />
          </div>
          <span class="popup-title">FetchX</span>
        </div>
        <div class="header-actions">
          <div id="status-badge" class="status-chip status-checking">
            <span class="status-dot"></span>
            <span id="status-text">Checking…</span>
          </div>
          <button id="settings-btn" class="btn-ghost">Settings</button>
        </div>
      </header>

      <!-- ── Tab navigation ────────────────────────────────────── -->
      <nav class="tab-nav" role="tablist">
        <button class="tab-btn tab-active" data-tab="add"       role="tab" aria-selected="true">Add</button>
        <button class="tab-btn"            data-tab="tasks"     role="tab" aria-selected="false">Tasks</button>
        <button class="tab-btn"            data-tab="resources" role="tab" aria-selected="false">Resources</button>
      </nav>

      <!-- ── TAB: Add ──────────────────────────────────────────── -->
      <div id="tab-add" class="tab-panel">

        <div class="target-row">
          <span class="target-label">Send to</span>
          <select id="target-select" class="target-select"></select>
        </div>

        <div class="url-group">
          <input
            id="url-input"
            class="url-input"
            type="url"
            placeholder="Paste a URL"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="use-tab-btn" class="btn-tab-url" title="Use current tab URL">Use tab</button>
        </div>

        <div id="media-detected" class="media-detected hidden" role="status" aria-live="polite">
          <span id="media-detected-text"></span>
          <button id="detected-media-btn" class="btn-text" type="button">Choose quality</button>
        </div>

        <button id="submit-btn" class="btn-primary" type="button" disabled>
          <span id="btn-text">Download with FetchX</span>
        </button>

        <button id="fetch-formats-btn" class="btn-secondary" type="button" disabled>
          Choose video quality
        </button>
        <button id="scan-page-btn" class="btn-secondary" type="button">
          Find downloads on this page
        </button>
        <div id="quality-panel" class="quality-panel hidden">
          <div class="quality-header">
            <span id="quality-title" class="quality-title"></span>
            <button id="download-all-formats-btn" class="btn-text" type="button">Download all</button>
          </div>
          <div id="quality-list" class="quality-list"></div>
        </div>

        <div id="result-banner" class="banner hidden" role="alert"></div>
      </div>

      <!-- ── TAB: Tasks ─────────────────────────────────────────── -->
      <div id="tab-tasks" class="tab-panel hidden">
        <div class="section-toolbar">
          <span class="section-label">Recent downloads</span>
          <button id="refresh-tasks-btn" class="btn-text">Refresh</button>
        </div>
        <div id="task-list" class="task-list">
          <div class="empty-state">
            <p>No downloads yet</p>
          </div>
        </div>
      </div>

      <!-- ── TAB: Resources ────────────────────────────────────── -->
      <div id="tab-resources" class="tab-panel hidden">
        <div class="section-toolbar">
          <span class="section-label">Page resources</span>
          <div class="filter-strip">
            <button class="filter-pill active" data-filter="all">All</button>
            <button class="filter-pill" data-filter="video">Video</button>
            <button class="filter-pill" data-filter="audio">Audio</button>
            <button class="filter-pill" data-filter="image">Image</button>
            <button class="filter-pill" data-filter="file">File</button>
          </div>
        </div>

        <div id="scan-empty" class="scan-area">
          <button id="scan-btn" class="btn-primary">
            <span>Scan this page</span>
          </button>
        </div>

        <div id="resource-list" class="resource-list hidden"></div>

        <div id="resource-actions" class="resource-footer hidden">
          <span id="selected-count" class="sel-count">0 selected</span>
          <button id="download-selected-btn" class="btn-primary btn-primary-sm" disabled>
            <span>Download selected</span>
          </button>
        </div>
      </div>

      <!-- ── Settings overlay ──────────────────────────────────── -->
      <div id="settings-panel" class="settings-overlay hidden">
        <div class="settings-sheet">

          <div class="settings-head">
            <span class="settings-title">Settings</span>
            <button id="settings-close-btn" class="btn-ghost">Close</button>
          </div>

          <div class="settings-body">

            <!-- Targets section -->
            <div class="settings-section">
              <div class="settings-section-title">FetchX targets</div>
              <div class="settings-inner">
                <div id="target-list" class="target-cards"></div>

                <div class="form-row">
                  <span class="form-label-sm">Name</span>
                  <input id="target-name" type="text" class="field" maxlength="64" autocomplete="off" placeholder="Home server" />
                </div>
                <div class="form-row">
                  <span class="form-label-sm">HTTPS URL</span>
                  <input id="target-endpoint" type="url" class="field" autocomplete="url" placeholder="https://fetchx.example.com" />
                </div>
                <div class="form-row">
                  <span class="form-label-sm">Bearer token</span>
                  <input id="target-token" type="password" class="field" autocomplete="new-password" />
                </div>

                <button id="target-add-btn" class="btn-primary btn-primary-sm" type="button">
                  Save remote target
                </button>
                <div id="target-result" class="banner hidden" role="status"></div>
              </div>
            </div>

            <!-- Behaviour section -->
            <div class="settings-section">
              <div class="settings-section-title">Behaviour</div>
              <div class="settings-inner">
                <div class="form-row">
                  <span class="form-label">Auto-intercept downloads</span>
                  <input id="set-auto-intercept" type="checkbox" class="toggle" />
                </div>
                <div class="form-row">
                  <span class="form-label">Minimum file size (MB)</span>
                  <input id="set-min-size" type="number" min="0" max="10240" class="field-num" />
                </div>
                <div class="form-row">
                  <span class="form-label">Show notifications</span>
                  <input id="set-notifications" type="checkbox" class="toggle" />
                </div>
              </div>
            </div>

            <div class="settings-footer">
              <button id="settings-save-btn" class="btn-primary btn-primary-sm">Save</button>
            </div>

          </div>
        </div>
      </div>

    </div><!-- /.popup-root -->
    <script src="dist/popup.js"></script>
  </body>
</html>
