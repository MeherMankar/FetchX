[package]
name = "fetchx-native-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "fetchx-native-host"
path = "src/main.rs"

[dependencies]
fetchx-browser-protocol = { path = "../../../crates/browser-protocol" }
fetchx-remote-protocol = { path = "../../../crates/remote-protocol" }
reqwest = { workspace = true, features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[lints]
workspace = true
