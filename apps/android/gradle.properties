android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
# Android Gradle Plugin + Chaquopy currently hits a configuration-cache incompatibility
# on the local JDK. Disable it so clean builds/install tasks keep working.
org.gradle.configuration-cache=false
org.gradle.caching=true
