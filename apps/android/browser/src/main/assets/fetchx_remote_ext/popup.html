<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FetchX</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f4;
        --surface: #ffffff;
        --surface-raised: #e8e8e8;
        --border: #c6c6c6;
        --text: #161616;
        --text-secondary: #525252;
        --accent: #0f62fe;
        --accent-hover: #0353e9;
        --accent-ink: #ffffff;
        font-family: "IBM Plex Sans", Roboto, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #111517;
          --surface: #191f21;
          --surface-raised: #222a2c;
          --border: #394447;
          --text: #edf2f2;
          --text-secondary: #bcc8ca;
          --accent: #55c7f2;
          --accent-hover: #39b2df;
          --accent-ink: #102124;
        }
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 280px; background: var(--bg); }
      main { display: grid; gap: 12px; padding: 20px; }
      h1 { font-size: 20px; font-weight: 500; }
      p { color: var(--text-secondary); font-size: 14px; }
      button, input { font: inherit; }
      button {
        min-height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        color: var(--text);
        background: var(--surface-raised);
      }
      button:hover { filter: brightness(0.94); }
      form { display: grid; gap: 8px; margin-top: 4px; }
      label { color: var(--text-secondary); font-size: 13px; }
      input {
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        background: var(--surface);
      }
      input:focus { border-color: var(--accent); outline: 0; }
      #download { color: var(--accent-ink); background: var(--accent); }
      #download:hover { background: var(--accent-hover); filter: none; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #result { color: var(--text-secondary); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>FetchX Android</h1>
      <p>Submit a URL to this device through FetchX.</p>
      <button id="connect" type="button">Check connection</button>
      <button id="list-downloads" type="button">List downloads</button>
      <form id="download-form">
        <label for="download-url">HTTP or HTTPS URL</label>
        <input id="download-url" type="url" autocomplete="url" required>
        <button id="download" type="submit">Add to FetchX</button>
      </form>
      <output id="result" aria-live="polite"></output>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
