name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Rust unit tests (all platforms compile + test on Linux for speed)
  # ──────────────────────────────────────────────────────────────────────────
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --exclude fetchx-desktop

      - name: cargo test
        run: cargo test --workspace --exclude fetchx-desktop

      - name: cargo clippy
        run: cargo clippy --workspace --exclude fetchx-desktop --all-targets --all-features -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Android APK (arm64-v8a debug + release)
  # ──────────────────────────────────────────────────────────────────────────
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build Rust .so for arm64-v8a
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o apps/android/bridge/src/main/jniLibs \
            build --release \
            -p fetchx-android-bridge

      - name: Build Rust .so for x86_64
        run: |
          cargo ndk \
            -t x86_64 \
            -o apps/android/bridge/src/main/jniLibs \
            build --release \
            -p fetchx-android-bridge

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Generate UniFFI Kotlin bindings
        run: |
          cd apps/android
          ./gradlew :bridge:generateUniFfiKotlinBindings

      - name: Prepare optional Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            key_path="$RUNNER_TEMP/fetchx-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
            echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          cd apps/android
          ./gradlew assembleRelease
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Windows Desktop .exe + installer (Tauri)
  # ──────────────────────────────────────────────────────────────────────────
  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    needs: rust-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/ui

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app (Windows .exe + .msi)
        run: cargo tauri build
        working-directory: apps/desktop/src-tauri

      - name: Upload Windows installer .exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload Windows .msi
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Linux Desktop .deb + AppImage (Tauri)
  # ──────────────────────────────────────────────────────────────────────────
  linux-desktop:
    name: Linux Desktop
    runs-on: ubuntu-22.04
    needs: rust-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/ui

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app (Linux .deb + AppImage)
        run: cargo tauri build
        working-directory: apps/desktop/src-tauri

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 90

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 5. macOS Desktop .dmg (Tauri)
  # ──────────────────────────────────────────────────────────────────────────
  macos-desktop:
    name: macOS Desktop
    runs-on: macos-latest
    needs: rust-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/ui

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri app (macOS .dmg)
        run: cargo tauri build
        working-directory: apps/desktop/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 6. CLI binaries for the major desktop platforms
  # ──────────────────────────────────────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: target/release/fetchx
            artifact: cli-linux-x86_64
          - os: windows-latest
            binary: target/release/fetchx.exe
            artifact: cli-windows-x86_64
          - os: macos-latest
            binary: target/release/fetchx
            artifact: cli-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p fetchx

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Publish a draft GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [android-apk, windows-desktop, linux-desktop, macos-desktop, cli]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate manual release version
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve tag for tag-triggered release
        id: tag-push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          for file in "${files[@]}"; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"
            (cd "$directory" && sha256sum "$filename" > "$filename.sha256")
          done

      - name: List release files
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FetchX ${{ steps.release-tag.outputs.tag || steps.tag-push.outputs.tag }}"
          tag_name: ${{ steps.release-tag.outputs.tag || steps.tag-push.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## FetchX ${{ steps.release-tag.outputs.tag || steps.tag-push.outputs.tag }}

            ### Downloads
            - Android: APK (signed only when Android signing secrets are configured)
            - Windows: NSIS `.exe` installer and `.msi` installer
            - Linux: `.deb` and `.AppImage`
            - macOS: `.dmg`
            - CLI: Linux, Windows, and macOS binaries

            Each package has an adjacent `.sha256` checksum file.
            macOS packages require Apple signing/notarization secrets for distribution outside development.
          draft: true
          prerelease: ${{ contains(steps.release-tag.outputs.tag || steps.tag-push.outputs.tag, 'alpha') || contains(steps.release-tag.outputs.tag || steps.tag-push.outputs.tag, 'beta') || contains(steps.release-tag.outputs.tag || steps.tag-push.outputs.tag, 'rc') }}
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.dmg
            release-artifacts/**/fetchx
            release-artifacts/**/fetchx.exe
            release-artifacts/**/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
