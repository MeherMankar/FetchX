name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. alpha.0.0.1, a0.0.4, 1.2.3, or v1.2.3)"
        required: true
        type: string
      build_android:
        description: "Build the Android APK"
        required: false
        type: boolean
        default: true
      build_windows:
        description: "Build Windows desktop installer and CLI"
        required: false
        type: boolean
        default: true
      build_linux:
        description: "Build Linux desktop packages and CLI"
        required: false
        type: boolean
        default: true
      build_macos:
        description: "Build macOS desktop package and CLI"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Rust unit tests (all platforms compile + test on Linux for speed)
  # ──────────────────────────────────────────────────────────────────────────
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --exclude fetchx-desktop

      - name: cargo test
        run: cargo test --workspace --exclude fetchx-desktop

      - name: cargo clippy
        run: cargo clippy --workspace --exclude fetchx-desktop --all-targets --all-features -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Android APK (arm64-v8a debug + release)
  # ──────────────────────────────────────────────────────────────────────────
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_android
    env:
      APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      APP_VERSION_CODE: ${{ github.run_number }}
      CARGO_PROFILE_RELEASE_STRIP: symbols

    steps:
      - uses: actions/checkout@v4

      - name: Validate Android signing secrets
        if: github.event_name != 'workflow_dispatch' || inputs.build_android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          missing=()
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            printf 'Missing required Android signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set release version
        run: python scripts/set-version.py "${{ env.APP_VERSION }}"

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26*
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Android NDK r27
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo +stable install cargo-ndk --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Android builds use two native targets and do not benefit from
          # restoring or saving their large intermediate target directory.
          cache-targets: false
          workspaces: ". -> target"

      - name: Build Rust .so for arm64-v8a
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o apps/android/bridge/src/main/jniLibs \
            build --release \
            -p fetchx-android-bridge

      - name: Free Android Rust build artifacts
        run: cargo clean --target aarch64-linux-android


      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Generate UniFFI Kotlin bindings
        run: |
          chmod +x apps/android/gradlew
          cd apps/android
          ./gradlew :bridge:generateUniFfiKotlinBindings

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/fetchx-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          echo "ANDROID_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd apps/android
          ./gradlew assembleRelease -PciArm64Only=true
        env:
          ORG_GRADLE_PROJECT_appVersion: ${{ env.APP_VERSION }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ env.APP_VERSION_CODE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Windows Desktop .exe + installer (Tauri)
  # ──────────────────────────────────────────────────────────────────────────
  windows-desktop:
    name: Windows Desktop
    runs-on: windows-latest
    needs: rust-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: python scripts/set-version.py "${{ env.APP_VERSION }}"

      - name: Set numeric MSI build metadata
        shell: pwsh
        run: |
          $configPath = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ($version -match '^[0-9]+\.[0-9]+\.[0-9]+(?:-|[+])') {
            $runNumber = [int]$env:GITHUB_RUN_NUMBER
            if ($runNumber -lt 1 -or $runNumber -gt 65535) {
              throw "MSI build metadata must be between 1 and 65535; got $runNumber"
            }
            $config.version = "$($version -replace '\+.*$', '')+$runNumber"
            $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/ui

      - name: Build browser extension
        run: |
          npm ci
          npm run build
        working-directory: apps/browser/extension

      - name: Build native messaging host
        run: cargo build --release -p fetchx-native-host

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop/ui

      - name: Build Tauri app (Windows .exe + .msi)
        run: cargo tauri build
        working-directory: apps/desktop/src-tauri
        env:
          FETCHX_APP_VERSION: ${{ env.FETCHX_APP_VERSION || env.APP_VERSION }}

      - name: Upload Windows installer .exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload Windows .msi
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Linux Desktop .deb + AppImage (Tauri)
  # ──────────────────────────────────────────────────────────────────────────
  linux-desktop:
    name: Linux Desktop
    runs-on: ubuntu-22.04
    needs: rust-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: python scripts/set-version.py "${{ env.APP_VERSION }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/ui

      - name: Build browser extension
        run: |
          npm ci
          npm run build
        working-directory: apps/browser/extension

      - name: Build native messaging host
        run: cargo build --release -p fetchx-native-host

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop/ui

      - name: Build Tauri app (Linux .deb + AppImage)
        run: cargo tauri build
        working-directory: apps/desktop/src-tauri
        env:
          FETCHX_APP_VERSION: ${{ env.FETCHX_APP_VERSION || env.APP_VERSION }}

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 90

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 5. macOS Desktop .dmg (Tauri)
  # ──────────────────────────────────────────────────────────────────────────
  macos-desktop:
    name: macOS Desktop
    runs-on: macos-latest
    needs: rust-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: python scripts/set-version.py "${{ env.APP_VERSION }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/desktop/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/ui

      - name: Build browser extension
        run: |
          npm ci
          npm run build
        working-directory: apps/browser/extension

      - name: Build native messaging host
        run: cargo build --release -p fetchx-native-host

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: npm run build
        working-directory: apps/desktop/ui

      - name: Build Tauri app (macOS .dmg)
        run: cargo tauri build
        working-directory: apps/desktop/src-tauri
        env:
          FETCHX_APP_VERSION: ${{ env.FETCHX_APP_VERSION || env.APP_VERSION }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 6. CLI binaries for the major desktop platforms
  # ──────────────────────────────────────────────────────────────────────────
  cli-linux:
    name: CLI (Linux)
    runs-on: ubuntu-latest
    needs: rust-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: python scripts/set-version.py "${{ env.APP_VERSION }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p fetchx
        env:
          FETCHX_APP_VERSION: ${{ env.FETCHX_APP_VERSION || env.APP_VERSION }}

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x86_64
          path: target/release/fetchx
          if-no-files-found: error
          retention-days: 90

  cli-windows:
    name: CLI (Windows)
    runs-on: windows-latest
    needs: rust-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: python scripts/set-version.py "${{ env.APP_VERSION }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p fetchx
        env:
          FETCHX_APP_VERSION: ${{ env.FETCHX_APP_VERSION || env.APP_VERSION }}

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-windows-x86_64
          path: target/release/fetchx.exe
          if-no-files-found: error
          retention-days: 90

  cli-macos:
    name: CLI (macOS)
    runs-on: macos-latest
    needs: rust-tests
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos

    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        run: python scripts/set-version.py "${{ env.APP_VERSION }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p fetchx
        env:
          FETCHX_APP_VERSION: ${{ env.FETCHX_APP_VERSION || env.APP_VERSION }}

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: target/release/fetchx
          if-no-files-found: error
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Publish a draft GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      [
        rust-tests,
        android-apk,
        windows-desktop,
        linux-desktop,
        macos-desktop,
        cli-linux,
        cli-windows,
        cli-macos,
      ]
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') &&
      needs.rust-tests.result == 'success' &&
      needs.android-apk.result != 'failure' && needs.android-apk.result != 'cancelled' &&
      needs.windows-desktop.result != 'failure' && needs.windows-desktop.result != 'cancelled' &&
      needs.linux-desktop.result != 'failure' && needs.linux-desktop.result != 'cancelled' &&
      needs.macos-desktop.result != 'failure' && needs.macos-desktop.result != 'cancelled' &&
      needs.cli-linux.result != 'failure' && needs.cli-linux.result != 'cancelled' &&
      needs.cli-windows.result != 'failure' && needs.cli-windows.result != 'cancelled' &&
      needs.cli-macos.result != 'failure' && needs.cli-macos.result != 'cancelled' &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.build_android || inputs.build_windows || inputs.build_linux || inputs.build_macos)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate manual release version
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="${INPUT_VERSION#v}"
          if [[ "$version" =~ ^a([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="alpha.${BASH_REMATCH[1]}"
          elif [[ "$version" =~ ^b([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="beta.${BASH_REMATCH[1]}"
          elif [[ "$version" =~ ^rc([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="rc.${BASH_REMATCH[1]}"
          fi
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?|[A-Za-z][A-Za-z0-9-]*\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Version must look like alpha.0.0.1, a0.0.4, 1.2.3, or 1.2.3-rc.1"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Resolve tag for tag-triggered release
        id: tag-push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          mapfile -d '' files < <(find release-artifacts -type f -print0)
          for file in "${files[@]}"; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"
            (cd "$directory" && sha256sum "$filename" > "$filename.sha256")
          done

      - name: List release files
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FetchX ${{ steps.release-tag.outputs.tag || steps.tag-push.outputs.tag }}"
          tag_name: ${{ steps.release-tag.outputs.tag || steps.tag-push.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## FetchX ${{ steps.release-tag.outputs.tag || steps.tag-push.outputs.tag }}

            ### Downloads
            - Android: APK (signed only when Android signing secrets are configured)
            - Windows: NSIS `.exe` installer and `.msi` installer
            - Linux: `.deb` and `.AppImage`
            - macOS: `.dmg`
            - CLI: Linux, Windows, and macOS binaries

            Each package has an adjacent `.sha256` checksum file.
            macOS packages require Apple signing/notarization secrets for distribution outside development.
          draft: true
          prerelease: ${{ contains(steps.release-tag.outputs.tag || steps.tag-push.outputs.tag, 'alpha') || contains(steps.release-tag.outputs.tag || steps.tag-push.outputs.tag, 'beta') || contains(steps.release-tag.outputs.tag || steps.tag-push.outputs.tag, 'rc') }}
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.dmg
            release-artifacts/**/fetchx
            release-artifacts/**/fetchx.exe
            release-artifacts/**/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false
