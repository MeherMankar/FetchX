name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Rust: fmt + check + test + clippy
  # ──────────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js for browser extension
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/browser/extension/package-lock.json

      - name: Build browser extension (Windows CI includes fetchx-desktop)
        if: runner.os == 'Windows'
        run: |
          npm ci
          npm run build
        working-directory: apps/browser/extension

      - name: Build native messaging host for Tauri resources
        if: runner.os == 'Windows'
        run: cargo build --release -p fetchx-native-host

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo check
        # Exclude Tauri desktop on Linux CI to avoid heavy webkit deps
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo check --workspace --exclude fetchx-desktop
          else
            cargo check --workspace
          fi
        shell: bash

      - name: cargo test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --exclude fetchx-desktop
          else
            cargo test --workspace
          fi
        shell: bash

      - name: cargo clippy
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo clippy --workspace --exclude fetchx-desktop --all-targets --all-features -- -D warnings
          else
            cargo clippy --workspace --all-targets --all-features -- -D warnings
          fi
        shell: bash

  # ──────────────────────────────────────────────────────────────────────────
  # Android: build debug APK to confirm it compiles
  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Android Debug Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26*
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Android NDK r27
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo +stable install cargo-ndk --locked

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # The Android target is explicitly cleaned below before Gradle runs.
          # Caching it only inflates the runner cache and post-job cleanup.
          cache-targets: false

      - name: Build Rust .so (arm64-v8a debug)
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o apps/android/bridge/src/main/jniLibs \
            build \
            -p fetchx-android-bridge
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"

      - name: Build native FFmpeg shim (arm64-v8a debug)
        run: |
          cargo ndk \
            -t arm64-v8a \
            build \
            -p fetchx-downloader \
            --bin fetchx-native-ffmpeg
          mkdir -p apps/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/debug/fetchx-native-ffmpeg \
            apps/android/app/src/main/jniLibs/arm64-v8a/libfetchx_ffmpeg_native.so
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"

      - name: Free Android Rust build artifacts
        run: cargo clean --target aarch64-linux-android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/android/**/*.gradle*', 'apps/android/**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Generate UniFFI bindings + build debug APK
        run: |
          cd apps/android
          ./gradlew :bridge:generateUniFfiKotlinBindings assembleDebug -PciArm64Only=true

      - name: Upload debug APK (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FetchX-debug-ci.apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Windows desktop: quick compile check
  # ──────────────────────────────────────────────────────────────────────────
  windows-desktop-check:
    name: Windows Desktop Check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            apps/browser/extension/package-lock.json
            apps/desktop/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop/ui

      - name: Build browser extension
        run: |
          npm ci
          npm run build
        working-directory: apps/browser/extension

      - name: cargo check (desktop)
        run: cargo check -p fetchx-desktop
