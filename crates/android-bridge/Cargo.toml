[package]
name = "fetchx-android-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "fetchx_android_bridge"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["uniffi-cli"]

[features]
uniffi-cli = ["uniffi/cli"]
[dependencies]
fetchx-core-services = { path = "../core-services" }
fetchx-core          = { path = "../core" }
fetchx-downloader    = { path = "../downloader" }
fetchx-media-extractor = { path = "../media-extractor" }
fetchx-models        = { path = "../models" }
fetchx-queue         = { path = "../queue" }
fetchx-scheduler     = { path = "../scheduler" }
fetchx-storage       = { path = "../storage" }
uniffi                     = { version = "0.29", features = ["tokio"] }
tokio.workspace             = true
thiserror.workspace         = true
tracing.workspace           = true

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
tempfile = "3"
uuid = { workspace = true }

# This crate does NOT inherit workspace lints because the workspace sets
# `unsafe_code = "forbid"` and UniFFI's generated scaffolding requires
# `#[unsafe(no_mangle)]` for FFI exports.  We replicate all other workspace
# lint levels here and set unsafe_code = "allow" for this crate only.
# The single unsafe site is the uniffi::include_scaffolding! expansion in lib.rs.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
