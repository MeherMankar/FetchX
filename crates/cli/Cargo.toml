[package]
name = "fetchx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "fetchx"
path = "src/main.rs"

[dependencies]
fetchx-core-services = { path = "../core-services" }
fetchx-downloader    = { path = "../downloader" }
fetchx-models        = { path = "../models" }
fetchx-plugin-manager = { path = "../plugin-manager" }
fetchx-queue         = { path = "../queue" }
fetchx-remote-protocol = { path = "../remote-protocol" }
fetchx-remote-server = { path = "../remote-server" }
fetchx-scheduler     = { path = "../scheduler" }
fetchx-storage       = { path = "../storage" }
dirs = "5.0"
clap.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
