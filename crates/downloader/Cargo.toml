[package]
name = "fetchx-downloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
audio2mp3-core = "0.2.0"
base64.workspace = true
fetchx-core = { path = "../core" }
fetchx-media-extractor = { path = "../media-extractor" }
fetchx-models = { path = "../models" }
fetchx-storage = { path = "../storage" }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
suppaftp = { version = "6.3.0", default-features = false, features = ["rustls"] }
russh = { version = "0.63.1", default-features = false, features = ["ring", "flate2"] }
russh-sftp = { version = "2.0.5", default-features = false }
async-trait = "0.1"
webpki-roots = "1"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
netstat2.workspace = true
roxmltree = "=0.21.1"
digest = "=0.11.3"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
md-5 = "=0.11.0"
hex = "=0.4.3"
mp4 = "0.14.0"
shiguredo_mp4 = "=2026.3.0"
ebml-webm = "=0.2.1"
flacenc = { version = "=0.5.1", default-features = false }
hound = "=3.5.1"

[features]
phase28-benchmark-local-http = []
phase30-queue-fault-injection = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
rand = "0.10"
rcgen = "0.13.2"
tokio-rustls.workspace = true
