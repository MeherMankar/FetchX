[package]
name = "fetchx-downloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
audio2mp3-core = { version = "0.2.0", features = ["pcm-convert"] }
base64.workspace = true
fetchx-core = { path = "../core" }
fetchx-media-extractor = { path = "../media-extractor" }
fetchx-models = { path = "../models" }
fetchx-storage = { path = "../storage" }
fetchx-playready = { path = "../playready" }
fetchx-widevine = { path = "../widevine" }
fdk-aac-rs = { version = "0.1.0", default-features = false, features = ["encoder"] }
opus = "0.4.0"
openh264 = "0.9.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
id3 = "1"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
suppaftp = { version = "6.3.0", default-features = false, features = ["rustls"] }
russh = { version = "0.63.1", default-features = false, features = ["ring", "flate2"] }
russh-sftp = { version = "2.0.5", default-features = false }
async-trait = "0.1"
webpki-roots = "1"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
roxmltree = "=0.21.1"
digest = "=0.11.3"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
md-5 = "=0.11.0"
hex = "=0.4.3"
mp4 = "0.14.0"
shiguredo_mp4 = "=2026.3.0"
ebml-webm = "=0.2.1"
hound = "=3.5.1"
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp1", "mp2", "mp3", "ogg", "pcm", "vorbis", "wav"] }
oxideav-core = "=0.1.43"
oxideav-flac = "=0.0.13"
oxideav-meta = { version = "=0.0.4", default-features = false, features = [
    # Containers for stream-copy mux/demux (no codec decode/encode needed)
    "mp4", "mkv", "mov", "avi", "ogg", "flv", "mpegts", "riff",
    # Audio codec passthrough (probe + copy, no full decode)
    "aac", "mp1", "mp2", "mp3", "opus", "flac", "vorbis", "ac3", "ac4",
    "adpcm", "basic", "g711", "g722", "g7231", "g728", "gsm", "ilbc",
    "celt", "ape", "musepack", "wma", "shorten", "speex", "tta",
    "amiga-mod", "nsf", "s3m", "iff",
    # Video codec passthrough (probe + copy, no full decode)
    "h264", "h265", "h266", "vp8", "vp9", "av1",
    "mpeg12video", "msmpeg4", "huffyuv", "mjpeg",
    "cinepak", "dirac", "ffv1", "magicyuv", "prores", "theora", "utvideo",
    # Subtitles
    "ass", "sub-image", "subtitle",
    # Filters
    "audio-filter",
]}
yt-dlp-rs = { git = "https://github.com/aagedal/yt-dlp-rs.git", rev = "1acb65568c0625ab982d46c7e05d3edb0bf19de0" }

[features]
phase28-benchmark-local-http = []
phase30-queue-fault-injection = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
rand = "0.10"
rcgen = "0.13.2"
tokio-rustls.workspace = true




