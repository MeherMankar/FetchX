[workspace]
members = [
    "crates/models",
    "crates/core",
    "crates/storage",
    "crates/downloader",
    "crates/media-extractor",
    "crates/queue",
    "crates/scheduler",
    "crates/browser-protocol",
    "crates/remote-protocol",
    "crates/remote-server",
    "crates/plugin-api",
    "crates/plugin-manager",
    "crates/core-services",
    "crates/cli",
    "crates/android-bridge",
    "apps/desktop/src-tauri",
    "apps/browser/native-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
netstat2 = "0.11.2"
url = "2"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
